name: Build itch.io package
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:itch
      - name: Zip (index.html at root)
        run: |
          cd dist-itch
          rm -f robots.txt
          zip -r ../itchio-upload.zip .
          cd ..
          unzip -l itchio-upload.zip
          unzip -l itchio-upload.zip | grep -q " index.html$"
      - uses: actions/upload-artifact@v4
        with:
          name: itchio-upload
          path: itchio-upload.zip
